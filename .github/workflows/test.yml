name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run host tests
        run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,quality]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run Mypy
        run: python -m mypy src

  package-gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Install wheel and exercise offscreen mock GUI
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m venv /tmp/hostapp-smoke
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel"
          /tmp/hostapp-smoke/bin/python -m pip install "${wheel}[gui,serial]"
          /tmp/hostapp-smoke/bin/python - <<'PY'
          from PyQt5.QtWidgets import QApplication
          from host_app.communication.mock_serial import MockSerialBackend
          from host_app.gui.main_window import MainWindow
          from host_app.models.connection import ConnectionState

          app = QApplication([])
          backend = MockSerialBackend()
          window = MainWindow(backend)
          window.show()
          app.processEvents()
          assert window.connection_panel.port_combo.currentData() == "MOCK0"
          window.connect_serial("MOCK0", 115200)
          assert window.application.state == ConnectionState.CONNECTED
          window.send_command("status")
          backend.queue_receive(b"ready\n")
          window.poll_serial()
          assert "[RX] ready" in window.terminal.output.toPlainText()
          window.disconnect_serial()
          window.close()
          print("Installed wheel offscreen mock GUI smoke passed")
          PY
      - name: Run GUI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -e ".[gui,serial,test]"
          python -m pytest tests/test_gui.py
