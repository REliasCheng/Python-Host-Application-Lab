[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-host-application-lab"
version = "0.1.0"
description = "A testable Python host application core for line-oriented serial devices."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Elias Cheng" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
gui = ["PyQt5>=5.15,<6"]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
host-app = "host_app.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=host_app.core",
  "--cov=host_app.communication.mock_serial",
  "--cov=host_app.protocol",
  "--cov=host_app.models",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

