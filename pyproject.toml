[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-host-application-lab"
version = "0.1.0"
description = "A testable Python host application core for line-oriented serial devices."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elias Cheng" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.urls]
Repository = "https://github.com/REliasCheng/Python-Host-Application-Lab"
Documentation = "https://github.com/REliasCheng/Python-Host-Application-Lab#readme"
Issues = "https://github.com/REliasCheng/Python-Host-Application-Lab/issues"

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
gui = ["PyQt5>=5.15,<6"]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
quality = [
  "mypy>=1.11,<3",
  "ruff>=0.9,<1",
  "types-pyserial>=3.5.0.20240311",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "types-pyserial>=3.5.0.20240311",
]

[project.scripts]
host-app = "host_app.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=host_app.core",
  "--cov=host_app.communication.mock_serial",
  "--cov=host_app.protocol",
  "--cov=host_app.models",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

